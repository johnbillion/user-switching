# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Nightly Tests
on:
  schedule:
    # Once daily at 04:00 UTC.
    #
    #        ┌───────────── minute           (0 - 59)
    #        │  ┌────────── hour             (0 - 23)
    #        │  │  ┌─────── day of the month (1 - 31)
    #        │  │  │  ┌──── month            (1 - 12 or JAN-DEC)
    #        │  │  │  │  ┌─ day of the week  (0 - 6 or SUN-SAT)
    #        │  │  │  │  │
    #        │  │  │  │  │
    #        │  │  │  │  │
    - cron: '0  4  *  *  *'
  push:
    branches:
      - 'develop'
    paths:
      - '.github/workflows/nightly-tests.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/nightly-tests.yml'
  workflow_dispatch:

permissions: {}

jobs:
  acceptance:
    name: Nightly ${{ matrix.label }}
    permissions:
      contents: read # Needed to clone the repo.
    strategy:
      matrix:
        label:
          - 'acceptance'
        php:
          - '8.3'
          - '7.4'
      fail-fast: false
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-acceptance-tests.yml@58c88f6aa243ca37eecf820ef1a2dd1399abb485 # 2.4.0
    with:
      wp: 'nightly'
      php: ${{ matrix.php }}
      node: false
      cache: false

  integration:
    name: Nightly ${{ matrix.label }}
    permissions:
      contents: read # Needed to clone the repo.
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-integration-tests.yml@58c88f6aa243ca37eecf820ef1a2dd1399abb485 # 2.4.0
    strategy:
      matrix:
        label:
          - 'integration'
        php:
          - '8.3'
          - '7.4'
      fail-fast: false
    with:
      wp: 'nightly'
      php: ${{ matrix.php }}
      cache: false
