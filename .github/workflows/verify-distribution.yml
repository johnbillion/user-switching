# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Verify Plugin Distribution
on:
  schedule:
    # Once per hour
    #
    #        ┌───────────── minute           (0 - 59)
    #        │  ┌────────── hour             (0 - 23)
    #        │  │  ┌─────── day of the month (1 - 31)
    #        │  │  │  ┌──── month            (1 - 12 or JAN-DEC)
    #        │  │  │  │  ┌─ day of the week  (0 - 6 or SUN-SAT)
    #        │  │  │  │  │
    #        │  │  │  │  │
    #        │  │  │  │  │
    - cron: '40 *  *  *  *'
  push:
    branches:
      - 'develop'
    paths:
      - '.github/workflows/verify-distribution.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/verify-distribution.yml'
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify Plugin Distribution
    permissions:
      contents: write      # Needed to push commits
      pull-requests: write # Needed to create a PR
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-verify-distribution.yml@43b7d4940a169c60bae794841b3dfb9861d0d5e1
    with:
      plugin: user-switching
      owner: johnbillion
      did: did:plc:ap4bi3w5w42oy7hfom57tehj
      did-log-path: .did/log.json
