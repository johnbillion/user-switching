# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Deploy Assets
on:
  push:
    branches:
      - deploy

permissions: {}

jobs:
  wordpress:
    name: WordPress.org
    permissions:
      contents: read # Needed to clone the repo.
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-deploy-assets.yml@294edc068c173342bc8c581e7a9f04ae4c63b91b # 2.6.0
    with:
      plugin: user-switching
      readme: readme.txt
      username: johnbillion
    secrets:
      WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
