# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Deploy Assets
on:
  push:
    branches:
      - deploy

permissions: {}

jobs:
  wordpress:
    name: WordPress.org
    permissions:
      contents: read # Needed to clone the repo.
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-deploy-assets.yml@9203bb0c5423a9a4b395ff5ffd093ba3714d723f # 2.5.1
    with:
      plugin: user-switching
      readme: readme.txt
      username: johnbillion
    secrets:
      WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
