# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Acceptance Tests
on:
  push:
    branches:
      - 'develop'
      - 'trunk'
    paths:
      - '.github/workflows/acceptance-tests.yml'
      - 'tests/acceptance/**'
      - 'user-switching.php'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'package.json'
      - 'tsconfig.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/acceptance-tests.yml'
      - 'tests/acceptance/**'
      - 'user-switching.php'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: WP ${{ matrix.wp }}
    permissions:
      contents: read
    strategy:
      # See the following for PHP compatibility of WordPress versions:
      # https://make.wordpress.org/core/handbook/references/php-compatibility-and-wordpress-versions/
      matrix:
        wp:
          # Three most recent versions of WordPress
          - '6.9-RC1'
          - '6.8'
          - '6.7'
        php:
          # Most recent version of PHP supported by all of the above, plus 7.4
          - '8.3'
          - '7.4'
        include:
          # Latest WordPress on PHP 8.4
          - wp: '6.9-RC1'
            php: '8.4'
          # Oldest supported WordPress on its newest supported PHP, plus 7.4:
          - wp: '6.1'
            php: '8.2'
          - wp: '6.1'
            php: '7.4'
      fail-fast: false
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-acceptance-tests.yml@a048b59a5c12c765cdba381cc67cf97eb67b5bbc
    with:
      wp: ${{ matrix.wp }}
      php: ${{ matrix.php }}
      node: false
